# Konfigurasi minimal Supabase CLI. Jalankan `supabase start` lalu `supabase db reset`.
project_id = "atomo-film-studio"

[api]
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
port = 54323

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
enable_signup = true

[auth.email]
enabled = true
enable_confirmations = false

[storage]
file_size_limit = "50MiB"

# 2FA TOTP (Google Authenticator, Authy, dll.) — wajib untuk superadmin.
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
