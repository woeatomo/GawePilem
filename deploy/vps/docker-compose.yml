# Worker di VPS: Redis (antrean) + worker (FFmpeg) + Caddy (HTTPS otomatis untuk endpoint /enqueue).
# Jalankan dari folder ini:  docker compose --env-file .env up -d --build
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379
      WORKER_PORT: "8787"
      STORAGE_DRIVER: s3
    depends_on: [redis]
    restart: unless-stopped
    # Render FFmpeg butuh CPU; sesuaikan dengan ukuran VPS.
    deploy:
      resources:
        limits: { cpus: "3", memory: 3g }

  caddy:
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      WORKER_DOMAIN: ${WORKER_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [worker]
    restart: unless-stopped

volumes:
  redis-data:
  caddy-data:
